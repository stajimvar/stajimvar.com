<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: çentikli ekranlarda kenarlara kadar uzansın -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Tarayıcının sayfa çevresindeki şeridinin rengi.

      Eskiden koyu maviydi ve telefon karanlık moddayken sayfanın üstünde
      açık zemine oturmayan koyu bir bant kalıyordu. Artık sayfa zeminiyle
      aynı: şerit görünmez oluyor, site uygulama gibi kenara kadar uzanıyor.

      İki şema için de aynı değer bilerek yazıldı: yalnızca tek bir renk
      verilse bazı tarayıcılar karanlık modda kendi koyu karşılığını üretiyor.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F9FAFB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#F9FAFB" />
    <meta name="theme-color" content="#F9FAFB" />

    <!-- Ana ekrana eklendiğinde tarayıcı çubuğu olmadan, uygulama gibi açılsın -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StajımVar" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Google Search Console dogrulamasi.

      Bu etiket SILINMEMELI: kaldirilirsa Google mulk dogrulamasini
      kaybediyor, tarama raporlari ve site haritasi gonderimi kapaniyor.
      Gizli bir deger degil; sayfanin kaynagindan zaten gorunuyor.
    -->
    <meta name="google-site-verification" content="23XH0reoo2hmnQqrJArkybqMmFQX7ztZiFYNDb3Qm3w" />

    <title>StajımVar - Staj Bulmanın En Akıllı Yolu</title>
    <!--
      ADSENSE SİTE DOĞRULAMASI — META ETİKETİ

      Doğrulama için Google'ın iki yolu var: sayfada betiğin yüklü olması ya
      da bu meta etiketi. Betik yolu, doğrulanmak uğruna betiği her sayfada
      yüklemeyi gerektiriyordu; artık betik yalnızca reklam yuvası olan
      rehber sayfalarında ve rızadan sonra yükleniyor. Meta etiketi
      doğrulamayı o kısıttan bağımsız hâle getiriyor.

      Değer .env'deki VITE_ADSENSE_CLIENT'tan geliyor — ads.txt ile aynı tek
      kaynak. Kimlik tanımsızsa Vite bu satırı boş içerikle bırakır; yanlış
      bir kimlik yazmaktansa boş kalması yeğ.
    -->
    <meta name="google-adsense-account" content="%VITE_ADSENSE_CLIENT%" />
    <meta name="description" content="Türkiye'deki staj ilanlarını şirketlerin kendi kariyer sayfalarından derliyoruz. Her ilanda şirketin kendi başvuru bağlantısı var." />
    <meta property="og:title" content="StajımVar - Staj Bulmanın En Akıllı Yolu" />
    <meta property="og:description" content="Türkiye'deki staj ilanlarını şirketlerin kendi kariyer sayfalarından derliyoruz. Her ilanda şirketin kendi başvuru bağlantısı var." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="StajımVar" />
    <!--
      PAYLAŞIM ÖNİZLEME GÖRSELİ

      `twitter:card=summary_large_image` vardı ama gösterilecek görsel
      yoktu: Safari'nin "Öneriler" kutusunda site, mavi bir karenin içinde
      "SV" yazısı olarak görünüyordu. Görsel yoksa istemciler baş harflere
      düşüyor.

      Adres MUTLAK olmalı — göreli adres çoğu paylaşım istemcisinde
      çözülmüyor. Ön render her sayfaya kendi og:url'sini yazıyor ama
      görsel sitenin tamamında aynı.

      Görseli `npm run og` üretiyor (scripts/og-gorsel.mjs); logo oradaki
      vektörden geliyor, elle çizilmiş bir kopya değil.
    -->
    <meta property="og:image" content="https://stajimvar.com/og-gorsel.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="StajımVar — Şirketlerin staj ilanları, tek listede" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://stajimvar.com/og-gorsel.png" />
    <!--
      AÇILIŞ STİLİ — HER ŞEYDEN ÖNCE

      SORUN
      Soğuk yenilemede sıra şuydu: çıplak ilan metni görünüyor, kısa bir
      beyaz ekran oluyor, gri iskelet geliyor, sonra site açılıyor.

      Sebebi güvenlik değil, FOUC: #root boş değil, içinde arama motoru için
      hazırlanan ön render metni duruyor ve tarayıcı onu HEMEN çiziyor. Dış
      CSS ise modül betiğinden SONRA geliyor (Vite böyle basıyor), yani
      biçimlenmemiş metin bir an ekranda kalıyor.

      ÇÖZÜM
      Bu blok satır içi ve <head> içindeki İLK stil: tarayıcı gövdeyi
      çizmeden önce okuyor.
        - Ön render metni JS açıkken gizleniyor (aşağıdaki noscript onu
          JS kapalıyken geri açıyor; arama motoru için içerik yerinde).
        - Yerine gerçek arayüzü taklit eden statik bir iskelet çiziliyor,
          böylece beyaz ekran da olmuyor.
      React ilk çizimini yaptığında #root'un içindekilerin ikisini de
      değiştiriyor.
    -->
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #f9fafb;
      }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      /* Ön render metni: arama motorunun okuduğu içerik, insanın görmediği. */
      [data-seo-prerender] {
        display: none;
      }
      /*
        AÇILIŞ İSKELETİ

        Gerçek düzeni taklit ediyor: üstte başlık çubuğu, altta üç sütun
        (geniş ekranda süzgeç / liste / kenar çubuğu). Ölçüler uygulamanın
        kendi iskeletiyle aynı olsun diye seçildi; React devreye girdiğinde
        sıçrama olmuyor.
      */
      #acilis-iskeleti {
        padding: 0 0 96px;
      }
      #acilis-iskeleti .sv-cubuk {
        height: 64px;
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
      }
      #acilis-iskeleti .sv-govde {
        max-width: 1440px;
        margin: 0 auto;
        padding: 20px 16px;
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr;
      }
      #acilis-iskeleti .sv-kutu {
        background: #eef0f3;
        border-radius: 16px;
      }
      #acilis-iskeleti .sv-liste .sv-kutu {
        height: 188px;
        margin-bottom: 16px;
      }
      #acilis-iskeleti .sv-yan {
        display: none;
      }
      @media (min-width: 1024px) {
        #acilis-iskeleti .sv-govde {
          grid-template-columns: 3fr 6fr 3fr;
          padding: 20px 32px;
        }
        #acilis-iskeleti .sv-yan {
          display: block;
          height: 320px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        #acilis-iskeleti .sv-kutu {
          animation: sv-nabiz 1.4s ease-in-out infinite;
        }
        @keyframes sv-nabiz {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.55; }
        }
      }
    </style>
    <noscript>
      <style>
        /* JS kapalıysa gösterilecek tek şey ön render içeriği. */
        [data-seo-prerender] {
          display: block;
        }
        #acilis-iskeleti {
          display: none;
        }
      </style>
    </noscript>

    <script>
      /*
        BAYAT HTML KURTARMASI

        Dağıtımda varlık adları değişiyor (index-ABC.css -> index-XYZ.css).
        Sayfayı açık tutan ya da geri/ileri belleğinden gelen bir tarayıcı,
        elindeki eski HTML ile artık silinmiş bir dosyayı isteyebiliyor.

        Ölçüldü: böyle bir istek stilsiz bir sayfa üretiyordu. Eksik varlık
        adresi SPA yedeği yüzünden 200 + text/html dönüyor; tarayıcı bunu
        yükleyemiyor ve `error` olayı tetikleniyor. Bu betik o hatayı yakalayıp
        sayfayı BİR KEZ, önbelleği aşarak yeniliyor.

        Tek seferlik: bayrak sessionStorage'da. Sorun dosya adından değil de
        ağdan kaynaklanıyorsa sonsuz yenileme döngüsüne girmiyoruz.
      */
      (function () {
        var ANAHTAR = 'sv-varlik-yenilendi';
        function kurtar() {
          try {
            if (sessionStorage.getItem(ANAHTAR)) return;
            sessionStorage.setItem(ANAHTAR, '1');
          } catch (e) {
            return; // gizli sekmede depolama kapalı olabilir; döngü riskini alma
          }
          /*
            location.reload() YETMİYOR

            Ölçüldü: bir varlık adresi, dağıtım sırasındaki kısa boşlukta
            uygulama kabuğunu (text/html) 200 ile döndürebiliyor ve TARAYICI
            bu yanlış cevabı kendi önbelleğine yazıyor. O andan sonra aynı
            adres önbellekten hep text/html geliyor; sıradan bir yenileme
            aynı bozuk kaydı okuduğu için sayfa stilsiz ve boş kalmaya devam
            ediyor.

            Bu yüzden yenileme adrese zaman damgası ekleyerek yapılıyor:
            HTML taze isteniyor, taze HTML de güncel varlık adlarını
            getiriyor ve bozuk kayıt devre dışı kalıyor.
          */
          var adres = location.pathname + location.search;
          adres += (location.search ? '&' : '?') + 'sv=' + Date.now();
          location.replace(adres + location.hash);
        }
        window.addEventListener(
          'error',
          function (olay) {
            var el = olay.target;
            if (!el || !el.tagName) return;
            var etiket = el.tagName.toLowerCase();
            var adres = el.href || el.src || '';
            if ((etiket === 'link' || etiket === 'script') && adres.indexOf('/assets/') !== -1) {
              kurtar();
            }
          },
          true // yakalama aşaması: kaynak hataları balonlanmıyor
        );
      })();
    </script>
  </head>
  <body>
    <!--
      İskelet #root'un İÇİNDE: React ilk çizimini yaptığında container'ın
      mevcut çocuklarını değiştiriyor, yani iskelet kendiliğinden kalkıyor.
      Dışarıda olsaydı onu ayrıca silen bir kod yazmak gerekirdi ve o kod
      React'ten önce ya da sonra çalışma yarışına girerdi.
    -->
    <div id="root">
      <div id="acilis-iskeleti" aria-hidden="true">
        <div class="sv-cubuk"></div>
        <div class="sv-govde">
          <div class="sv-kutu sv-yan"></div>
          <div class="sv-liste">
            <div class="sv-kutu"></div>
            <div class="sv-kutu"></div>
            <div class="sv-kutu"></div>
          </div>
          <div class="sv-kutu sv-yan"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
