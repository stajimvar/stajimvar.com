    <!-- viewport-fit=cover: çentikli ekranlarda kenarlara kadar uzansın -->

    <!--

      Eskiden koyu maviydi ve telefon karanlık moddayken sayfanın üstünde
      açık zemine oturmayan koyu bir bant kalıyordu. Artık sayfa zeminiyle
      aynı: şerit görünmez oluyor, site uygulama gibi kenara kadar uzanıyor.

      İki şema için de aynı değer bilerek yazıldı: yalnızca tek bir renk
      verilse bazı tarayıcılar karanlık modda kendi koyu karşılığını üretiyor.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F9FAFB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#F9FAFB" />
    <meta name="theme-color" content="#F9FAFB" />

    <title>StajımVar - Staj Bulmanın En Akıllı Yolu</title>
    <!--
      ADSENSE SİTE DOĞRULAMASI — META ETİKETİ

      Doğrulama için Google'ın iki yolu var: sayfada betiğin yüklü olması ya
      da bu meta etiketi. Betik yolu, doğrulanmak uğruna betiği her sayfada
      yüklemeyi gerektiriyordu; artık betik yalnızca reklam yuvası olan
      rehber sayfalarında ve rızadan sonra yükleniyor. Meta etiketi
      doğrulamayı o kısıttan bağımsız hâle getiriyor.

      DEĞER DERLEME SIRASINDA `reklam.json`'DAN YAZILIYOR.

      Burada bir Vite ortam değişkeni yer tutucusu duruyordu ve yorum
      "kimlik tanımsızsa Vite bu satırı boş içerikle bırakır" diyordu.
      ÜRETİM BUNU ÇÜRÜTTÜ: Vite yer tutucuyu yalnızca değişken TANIMLIYSA
      değiştiriyor, tanımsızsa OLDUĞU GİBİ bırakıyor. CI'da o değişken hiç
      yoktu; canlı ana sayfada aylarca yer tutucunun kendisi durdu ve
      Google doğrulama için bu etiketi okuduğunda geçersiz değer gördü.

      Yer tutucunun yazılışı bu yoruma bilerek KOPYALANMADI: üretim
      HTML'inde o dizenin hiç geçmemesi test ediliyor ve yorumda geçmesi
      testi yanıltırdı.

      Kimlik artık `vite.config.ts` içindeki `reklamMetaEtiketi()`
      eklentisiyle `reklam.json`'dan yazılıyor — ads.txt ile aynı tek
      kaynak. Kimlik geçersizse etiket KOMPLE DÜŞÜYOR: yer tutuculu ya da
      boş bir etiket, etiketin hiç olmamasından daha kötü.

      Aşağıdaki değer bir yer tutucu değil, eklentinin değiştirdiği
      hedef; doğrudan düzenlenmemeli.
    -->
    <meta name="google-adsense-account" content="ca-pub-2635670487159819" />
    <meta name="description" content="Türkiye'den ve yurt dışından staj ilanları tek listede. Çoğu şirketlerin kendi kariyer sayfalarından derlenir, bir kısmını işverenler doğrudan yayımlar." />
    <meta property="og:title" content="StajımVar - Staj Bulmanın En Akıllı Yolu" />
    <meta property="og:description" content="Türkiye'den ve yurt dışından staj ilanları tek listede. Çoğu şirketlerin kendi kariyer sayfalarından derlenir, bir kısmını işverenler doğrudan yayımlar." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="StajımVar" />
    <!--
      PAYLAŞIM ÖNİZLEME GÖRSELİ

      `twitter:card=summary_large_image` vardı ama gösterilecek görsel
      yoktu: Safari'nin "Öneriler" kutusunda site, mavi bir karenin içinde
      "SV" yazısı olarak görünüyordu. Görsel yoksa istemciler baş harflere
      düşüyor.

      Adres MUTLAK olmalı — göreli adres çoğu paylaşım istemcisinde
      çözülmüyor. Ön render her sayfaya kendi og:url'sini yazıyor ama
      görsel sitenin tamamında aynı.

      Görseli `npm run og` üretiyor (scripts/og-gorsel.mjs); logo oradaki
      vektörden geliyor, elle çizilmiş bir kopya değil.
    -->
    <meta property="og:image" content="https://stajimvar.com/og-gorsel.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="StajımVar — Şirketlerin staj ilanları, tek listede" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://stajimvar.com/og-gorsel.png" />
    <!--
      AÇILIŞ STİLİ — HER ŞEYDEN ÖNCE

      SORUN
      Soğuk yenilemede sıra şuydu: çıplak ilan metni görünüyor, kısa bir
      beyaz ekran oluyor, gri iskelet geliyor, sonra site açılıyor.

      Sebebi güvenlik değil, FOUC: #root boş değil, içinde arama motoru için
      hazırlanan ön render metni duruyor ve tarayıcı onu HEMEN çiziyor. Dış
      CSS ise modül betiğinden SONRA geliyor (Vite böyle basıyor), yani
      biçimlenmemiş metin bir an ekranda kalıyor.

      ÇÖZÜM
      Bu blok satır içi ve <head> içindeki İLK stil: tarayıcı gövdeyi
      çizmeden önce okuyor.
        - Ön render edilen içeriğin GÖRÜNÜR kısmı (`data-onrender-govde`)
          gerçek düzeniyle çiziliyor: üst çubuk, ilk ilan kartları,
          bağlantılar. JavaScript inmeden önce ekranda olan şey bu.
        - 12 Ekim 2026'dan beri gizli SEO kopyası (`data-seo-prerender`)
          YAZILMIYOR: ilan, rehber, bölüm, fırsat ve şirket sayfalarının
          metni de görünür bloğa ve `.sv-metin` okuma düzenine taşındı.
          Aşağıdaki kural eski önbellekli sayfalar için kalıyor.
        - Veri hiç yoksa (ön render edilmemiş adresler) bunun yerine
          nabız atan iskelet çiziliyor, yani beyaz ekran olmuyor.
      React ilk çizimini yaptığında #root'un içindekilerin hepsini
      birden değiştiriyor.
    -->
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #f9fafb;
      }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      /*
        Ön render metni: arama motorunun okuduğu, insanın görmediği kısım.

        Artık burada ilanların TAMAMI yok — ilk kartlar görünür bloğa
        (`[data-onrender-govde]`) taşındı. Gizli blokta yalnızca o
        kartlara girmeyenler duruyor, yani aynı ilan iki kez yazılmıyor.
      */
      [data-seo-prerender] {
        display: none;
      }

      /*
        AÇILIŞ DÜZENİ

        Aynı `.sv-` sınıfları iki yerde kullanılıyor: veri yokken açılış
        iskeletinde (nabız atan gri kutular), veri varken ön render
        edilmiş gerçek içerikte. Ölçüler ortak — React devreye
        girdiğinde satırlar yer değiştirmesin diye.
      */
      #acilis-iskeleti,
      [data-onrender-govde] {
        padding: 0 0 96px;
      }
      .sv-cubuk {
        height: 64px;
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
      }
      .sv-govde {
        max-width: 1440px;
        margin: 0 auto;
        padding: 20px 16px;
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr;
      }
      .sv-kutu {
        background: #eef0f3;
        border-radius: 16px;
      }
      #acilis-iskeleti .sv-liste .sv-kutu {
        height: 188px;
        margin-bottom: 16px;
      }
      .sv-yan {
        display: none;
      }

      /*
        GERÇEK KARTLAR

        İskelet kutusu (yukarıda, ön render edilmemiş adresler) 188px kaldı.
        Ön render kartı artık React kartının kendi ölçülerinde (aşağıda,
        14 Ekim 2026): JavaScript açılınca satırlar ona göre kaymıyor.
      */
      [data-onrender-govde] .sv-liste {
        min-width: 0;
      }
      /* Onaylanan tasarımdaki üst etiket: başlığın taşımadığı arama
         kelimesini ön render edilen HTML'de tutuyor. */
      [data-onrender-govde] .sv-etiket {
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #6b7280;
      }
      [data-onrender-govde] h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 800;
        line-height: 1.12;
        letter-spacing: -0.02em;
        color: #111827;
      }
      [data-onrender-govde] .sv-giris {
        margin: 0 0 16px;
        font-size: 14px;
        line-height: 1.55;
        color: #4b5563;
      }
      /*
        ÖN RENDER İLAN KARTI — REACT KARTININ ÖLÇÜLERİYLE (14 Ekim 2026)

        Ölçüler canlı InternshipCard'dan alındı: 16px iç boşluk ve köşe,
        80x80 logo kutusu (12px köşe, 8px iç boşluk, contain), başlık
        16/22 kalın, şirket ve konum 14/20, "İlanı incele" 44px yüksek mavi
        çerçeveli düğme. Renkler Tailwind'in sRGB karşılıkları. Kartlar
        arası boşluk masaüstünde 12, telefonda 6 (React ile aynı).
        Eskiden kart 188px sabit yükseklikteydi (gri iskelet kutusuyla
        eşitti); React kartı 126 (masaüstü) / ~220 (telefon) ve bu ölçü
        kendiliğinden ona yakın düşüyor.
      */
      .sv-kartlar {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .sv-kart {
        box-sizing: border-box;
        margin-bottom: 6px;
        padding: 16px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-width: 0;
      }
      .sv-logo {
        box-sizing: border-box;
        flex: 0 0 auto;
        width: 80px;
        height: 80px;
        aspect-ratio: 1 / 1;
        padding: 8px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .sv-logo img {
        width: 100%;
        height: 100%;
        aspect-ratio: 1 / 1;
        object-fit: contain;
        display: block;
      }
      /* Logo yedeği: CompanyLogo ile aynı baş harfler ve renk sırası. */
      .sv-logo-yedek {
        font-size: 24px;
        font-weight: 900;
        line-height: 1;
        user-select: none;
      }
      .sv-logo-p0 { background: #dbeafe; color: #1d4ed8; }
      .sv-logo-p1 { background: #d1fae5; color: #047857; }
      .sv-logo-p2 { background: #ffedd5; color: #c2410c; }
      .sv-logo-p3 { background: #ede9fe; color: #6d28d9; }
      .sv-logo-p4 { background: #ffe4e6; color: #be123c; }
      .sv-logo-p5 { background: #cffafe; color: #0e7490; }
      .sv-kart-govde {
        min-width: 0;
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
      }
      .sv-kart-baslik {
        font-size: 16px;
        font-weight: 600;
        line-height: 22px;
        color: #0f172a;
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      .sv-kart-sirket {
        margin-top: 2px;
        font-size: 14px;
        line-height: 20px;
        color: #374151;
        overflow-wrap: anywhere;
      }
      .sv-kart-alt-sira {
        margin-top: 4px;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 8px 12px;
      }
      .sv-kart-konum {
        flex: 1 1 112px;
        min-width: 0;
        display: inline-flex;
        align-items: flex-start;
        gap: 6px;
        font-size: 14px;
        line-height: 20px;
        color: #4b5563;
      }
      .sv-kart-konum svg {
        flex: 0 0 auto;
        margin-top: 2px;
        fill: none;
        stroke: #9ca3af;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sv-kart-incele {
        box-sizing: border-box;
        margin-left: auto;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid #2563eb;
        border-radius: 12px;
        background: #ffffff;
        color: #1d4ed8;
        font-size: 14px;
        font-weight: 600;
        line-height: 20px;
        white-space: nowrap;
        text-decoration: none;
      }
      @media (min-width: 640px) {
        .sv-kart {
          margin-bottom: 12px;
        }
      }
      /*
        Bölüm sayfasındaki açık ilanlar (14 Ekim 2026): kartlar okuma
        düzeninin (`.sv-metin`) içinde. Oradaki `ul` madde işareti ve
        girintisi, bağlantı rengi ve görsel yüksekliği karta geçmesin;
        kart /staj-ilanlari'dakiyle aynı görünsün.
      */
      .sv-metin .sv-kartlar {
        margin: 12px 0;
        padding-left: 0;
        list-style: none;
      }
      .sv-metin .sv-kart-baslik {
        color: #0f172a;
      }
      .sv-metin .sv-logo img {
        height: 100%;
      }
      .sv-metin .sv-kart-konum svg {
        width: 16px;
        height: 16px;
      }
      .sv-metin .sv-bolum-ilan-yok {
        font-size: 14px;
        color: #4b5563;
      }
      /* Ana sayfa: tüm ilanlara bağlantı ve fırsat şeridi (14 Ekim 2026). */
      .sv-tum-ilanlar {
        margin: 0 0 20px;
        font-size: 14px;
        font-weight: 700;
      }
      .sv-tum-ilanlar a,
      .sv-firsatlar p a {
        color: #1d4ed8;
        text-decoration: none;
      }
      .sv-firsatlar {
        margin: 0 0 20px;
        padding: 16px 20px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
      }
      .sv-firsatlar h2 {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 800;
        color: #111827;
      }
      .sv-firsatlar ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .sv-firsatlar li {
        padding: 6px 0;
        font-size: 14px;
        line-height: 1.4;
        border-top: 1px solid #f3f4f6;
      }
      .sv-firsatlar li a {
        color: #111827;
        font-weight: 600;
        text-decoration: none;
      }
      .sv-firsatlar li span {
        color: #6b7280;
        font-size: 13px;
      }
      .sv-firsatlar p {
        margin: 10px 0 0;
        font-size: 13px;
        font-weight: 700;
      }
      /* Ana sayfa: bölüm sayfalarına düz bağlantılar (14 Ekim 2026). */
      .sv-bolum-baglantilari {
        margin: 0 0 20px;
      }
      .sv-bolum-baglantilari h2 {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 800;
        color: #111827;
      }
      .sv-bolum-baglantilari ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
      }
      .sv-bolum-baglantilari a {
        display: inline-block;
        font-size: 14px;
        font-weight: 600;
        line-height: 24px;
        color: #1d4ed8;
        text-decoration: none;
      }
      .sv-nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
      }
      .sv-nav a {
        font-size: 13px;
        color: #4b5563;
      }

      /*
        OKUMA DÜZENİ — İLAN, REHBER, BÖLÜM, FIRSAT, ŞİRKET (12 Ekim 2026)

        Bu sayfaların ön render metni eskiden `data-seo-prerender` içinde
        gizliydi; JavaScript inene kadar ekranda gri kutular vardı. Artık
        metin GÖRÜNÜR ve burada sade bir okuma düzeni alıyor: içerik sütunu
        uygulamanınkiyle aynı genişlikte (768px), dış CSS beklenmeden
        okunur. React açılınca kökü kendi ağacıyla değiştiriyor.
      */
      .sv-metin {
        box-sizing: border-box;
        max-width: 768px;
        margin: 0 auto;
        padding: 16px 16px 0;
        font-size: 16px;
        line-height: 1.65;
        color: #374151;
        overflow-wrap: anywhere;
      }
      .sv-metin main {
        display: block;
      }
      .sv-metin h1,
      [data-onrender-govde] .sv-metin h1 {
        margin: 8px 0 8px;
        font-size: 28px;
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.02em;
        color: #111827;
      }
      .sv-metin h2 {
        margin: 24px 0 8px;
        font-size: 19px;
        font-weight: 800;
        line-height: 1.3;
        color: #111827;
      }
      .sv-metin h3 {
        margin: 16px 0 6px;
        font-size: 16px;
        font-weight: 700;
        color: #111827;
      }
      .sv-metin p,
      .sv-metin ul,
      .sv-metin ol {
        margin: 0 0 12px;
      }
      .sv-metin ul,
      .sv-metin ol {
        padding-left: 20px;
      }
      /* Tailwind'in sıfırlaması liste işaretini kaldırıyor; okuma düzeninde geri geliyor. */
      .sv-metin ul {
        list-style: disc;
      }
      .sv-metin ol {
        list-style: decimal;
      }
      .sv-metin .sv-bilgi {
        list-style: none;
      }
      .sv-metin a {
        color: #1d4ed8;
      }
      .sv-metin img,
      .sv-metin svg,
      .sv-metin picture {
        max-width: 100%;
        height: auto;
      }
      .sv-metin .sv-kirinti {
        font-size: 13px;
        color: #6b7280;
      }
      .sv-metin .sv-kirinti a {
        color: #4b5563;
      }
      .sv-metin .sv-alt {
        font-size: 15px;
        font-weight: 600;
        color: #2563eb;
      }
      .sv-metin .sv-uyari {
        padding: 12px 14px;
        border: 1px solid #fcd34d;
        border-radius: 12px;
        background: #fffbeb;
        color: #92400e;
        font-weight: 600;
      }
      .sv-metin .sv-bilgi {
        list-style: none;
        padding: 12px 16px;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        background: #ffffff;
      }
      .sv-metin .sv-eylem a {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 12px;
        background: #2563eb;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
      .sv-metin .sv-baglantilar {
        font-size: 14px;
      }

      @media (min-width: 1024px) {
        .sv-metin {
          padding: 24px 32px 0;
        }
        .sv-govde {
          grid-template-columns: 3fr 6fr 3fr;
          padding: 20px 32px;
        }
        .sv-yan {
          display: block;
          height: 320px;
        }
        [data-onrender-govde] h1 {
          font-size: 26px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        #acilis-iskeleti .sv-kutu {
          animation: sv-nabiz 1.4s ease-in-out infinite;
        }
        @keyframes sv-nabiz {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.55; }
        }
      }
    </style>
    <noscript>
      <style>
        /*
          JS kapalıyken kalan ilanlar da açılıyor. Görünür kartlar zaten
          ekranda; bu blok onların DEVAMI, kopyası değil.
        */
        [data-seo-prerender] {
          display: block;
          max-width: 1440px;
          margin: 0 auto;
          padding: 0 16px 96px;
        }
        #acilis-iskeleti {
          display: none;
        }
      </style>
    </noscript>

    <script>
      /*
        BAYAT HTML KURTARMASI

        Dağıtımda varlık adları değişiyor (index-ABC.css -> index-XYZ.css).
        Sayfayı açık tutan ya da geri/ileri belleğinden gelen bir tarayıcı,
        elindeki eski HTML ile artık silinmiş bir dosyayı isteyebiliyor.

        Ölçüldü: böyle bir istek stilsiz bir sayfa üretiyordu. Eksik varlık
        adresi SPA yedeği yüzünden 200 + text/html dönüyor; tarayıcı bunu
        yükleyemiyor ve `error` olayı tetikleniyor. Bu betik o hatayı yakalayıp
        sayfayı BİR KEZ, önbelleği aşarak yeniliyor.

        Tek seferlik: bayrak sessionStorage'da. Sorun dosya adından değil de
        ağdan kaynaklanıyorsa sonsuz yenileme döngüsüne girmiyoruz.
      */
      (function () {
        var ANAHTAR = 'sv-varlik-yenilendi';
        function kurtar() {
          try {
            if (sessionStorage.getItem(ANAHTAR)) return;
            sessionStorage.setItem(ANAHTAR, '1');
          } catch (e) {
            return; // gizli sekmede depolama kapalı olabilir; döngü riskini alma
          }
          /*
            location.reload() YETMİYOR

            Ölçüldü: bir varlık adresi, dağıtım sırasındaki kısa boşlukta
            uygulama kabuğunu (text/html) 200 ile döndürebiliyor ve TARAYICI
            bu yanlış cevabı kendi önbelleğine yazıyor. O andan sonra aynı
            adres önbellekten hep text/html geliyor; sıradan bir yenileme
            aynı bozuk kaydı okuduğu için sayfa stilsiz ve boş kalmaya devam
            ediyor.

            Bu yüzden yenileme adrese zaman damgası ekleyerek yapılıyor:
            HTML taze isteniyor, taze HTML de güncel varlık adlarını
            getiriyor ve bozuk kayıt devre dışı kalıyor.
          */
          var adres = location.pathname + location.search;
          adres += (location.search ? '&' : '?') + 'sv=' + Date.now();
          location.replace(adres + location.hash);
        }
        window.addEventListener(
          'error',
          function (olay) {
            var el = olay.target;
            if (!el || !el.tagName) return;
            var etiket = el.tagName.toLowerCase();
            var adres = el.href || el.src || '';
            if ((etiket === 'link' || etiket === 'script') && adres.indexOf('/assets/') !== -1) {
              kurtar();
            }
          },
          true // yakalama aşaması: kaynak hataları balonlanmıyor
        );
      })();
    </script>
  </head>
  <body>
    <!--
      İskelet #root'un İÇİNDE: React ilk çizimini yaptığında container'ın
      mevcut çocuklarını değiştiriyor, yani iskelet kendiliğinden kalkıyor.
      Dışarıda olsaydı onu ayrıca silen bir kod yazmak gerekirdi ve o kod
      React'ten önce ya da sonra çalışma yarışına girerdi.
    -->
    <div id="root">
      <div id="acilis-iskeleti" aria-hidden="true">
        <div class="sv-cubuk"></div>
        <div class="sv-govde">
          <div class="sv-kutu sv-yan"></div>
          <div class="sv-liste">
            <div class="sv-kutu"></div>
            <div class="sv-kutu"></div>
            <div class="sv-kutu"></div>
          </div>
          <div class="sv-kutu sv-yan"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
