name: Supabase disposable security tests
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**','scripts/sql/disposable-security-tests.sql','.github/workflows/supabase-disposable-security-tests.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - run: supabase db reset --local --no-seed
      - name: Run disposable SQL with local psql only
        run: |
          local_db_url="$(supabase status -o env | node scripts/assert-disposable-db-url.mjs)"
          psql -v ON_ERROR_STOP=1 -f scripts/sql/disposable-security-tests.sql "$local_db_url"
      - name: Clean disposable containers and volumes
        if: always()
        run: supabase stop --no-backup
