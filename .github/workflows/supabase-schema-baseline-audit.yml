name: Supabase production schema baseline audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-schema-baseline-audit.yml'
      - 'scripts/normalize-schema-dump.mjs'
      - 'scripts/schema-semantic-diff.mjs'
      - 'scripts/sql/verify-opportunity-source-0022.sql'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stajimvar-production-schema-audit
  cancel-in-progress: false

jobs:
  snapshot_and_compare:
    if: github.repository == 'stajimvar/stajimvar.com' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: gdumgdgwlfnohkaucfow
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          # SÜRÜM SABİT — `latest` DEĞİL
          #
          # Bu iş akışı üretim şemasını depodan kurulan şemayla
          # karşılaştırıyor; yani çıktısı CLI'ın döküm biçimine doğrudan
          # bağlı. `latest` ile her koşu farklı bir sürüm çekebiliyordu ve
          # dökümdeki bir biçim değişikliği, şema hiç değişmediği hâlde
          # "fark var" diye okunabilirdi. Denetimin kendisi
          # yeniden üretilebilir olmak zorunda.
          #
          # v2.117.0 en son KARARLI sürüm (beta olmayan); beta etiketleri
          # günde birkaç kez değişiyor ve denetim kapısı onlara
          # bağlanamaz.
          version: 2.117.0
      - name: Require protected production credentials
        run: |
          # Yalnızca DOLU OLUP OLMADIĞINA bakılıyor; hiçbir değer yazdırılmıyor.
          #
          # SUPABASE_DB_PASSWORD daha önce zorunlu değildi ve boş kaldığında
          # iş akışı sessizce `supabase link`'in parolasız dalına düşüp
          # pg_dump aşamasında "password authentication failed" ile
          # ölüyordu. 26 koşunun 25'i bu yüzden kırmızıydı ve kimse
          # nedenini görmüyordu. Eksik secret artık İLK adımda ve kendi
          # adıyla düşüyor.
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::$name GitHub Actions secret'i eksik."; exit 1; }
            echo "$name: mevcut"
          done
          [ "$SUPABASE_PROJECT_ID" = "gdumgdgwlfnohkaucfow" ] || { echo "::error::Unexpected Supabase production project id."; exit 1; }
      - name: Link production for schema-only inspection
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Verify 0022 behavior in a rolled-back transaction
        id: verify_0022
        continue-on-error: true
        run: supabase db query --linked --agent yes --output-format json -f scripts/sql/verify-opportunity-source-0022.sql > .schema-audit/0022-verification.json
      - name: Start disposable local Supabase database
        run: supabase start
      - name: Rebuild local schema from 0001 through 0022
        run: supabase db reset --local --no-seed
      - name: Dump and normalize local schema
        id: local_snapshot
        run: |
          # DİZİN BURADA AÇILIYOR: bu adım artık üretim dökümünden ÖNCE
          # koşuyor ve `mkdir` eskiden o adımın içindeydi. Sıra
          # değiştirilirken taşınmasa `--file .schema-audit/local.sql`
          # olmayan dizine yazmaya kalkıp düşerdi.
          mkdir -p .schema-audit
          supabase db dump --local --schema public,extensions --file .schema-audit/local.sql
          node scripts/normalize-schema-dump.mjs .schema-audit/local.sql .schema-audit/local.normalized.sql | tee .schema-audit/local-fingerprint.json
          grep -E '^(GRANT|REVOKE) ' .schema-audit/local.sql > .schema-audit/local-grants.sql || true
      # ÜRETİM ANLIK GÖRÜNTÜSÜ ARTIK YEREL YAPIDAN SONRA
      #
      # NEDEN SIRA DEĞİŞTİ — ÖLÇÜLDÜ
      #
      # Bu denetim `main`'e push ile tetikleniyor, sürüm hattı
      # (supabase-production.yml) da aynı push ile tetikleniyor ve ikisi
      # PARALEL koşuyor. Denetim üretimi hemen döküyordu; göç ise
      # sürüm hattının `migrate_and_functions` işinde uygulanıyor.
      #
      # 14 Eylül 2026 koşusunda ölçülen zamanlar:
      #   üretim dökümü bitti   20:11:06
      #   göç tamamlandı        20:11:17
      # Döküm, göçten ON BİR SANİYE ÖNCE alınmış. Sonuç: üretimde
      # `employer_career_checks.program_url` kolonu yok, göçten kurulan
      # yerel şemada var ve `differenceCount: 1` çıkıyor. Şema kayması
      # DEĞİL, sıralama hatası.
      #
      # Yerel yapı (supabase start + db reset) yaklaşık iki dakika
      # sürüyor; üretim dökümünü ona ALDIRMAK, göçün uygulanması için
      # zaten doğal bir pencere açıyor. Aşağıdaki sınırlı yeniden deneme
      # de kalan yarışı kapatıyor.
      - name: Dump and normalize production snapshot
        id: production_snapshot
        run: |
          mkdir -p .schema-audit
          supabase db dump --linked --schema public,extensions --file .schema-audit/production.sql
          node scripts/normalize-schema-dump.mjs .schema-audit/production.sql .schema-audit/production.normalized.sql | tee .schema-audit/production-fingerprint.json
          grep -E '^(GRANT|REVOKE) ' .schema-audit/production.sql > .schema-audit/production-grants.sql || true
      # DEPOLAMA POLİTİKALARI — DENETİMİN ESKİ KÖR NOKTASI
      #
      # Yukarıdaki döküm yalnızca public ve extensions şemalarını
      # kapsıyor. CV erişimi, avatar ve logo görünürlüğü ise
      # storage.objects politikalarında tanımlı ve o alan hiç
      # karşılaştırılmıyordu. 30 Ağustos'ta bedeli ölçüldü: üretimde olan
      # bir okuma politikası depoda yoktu, depodan kurulan her ortamda
      # profil fotoğrafları kırık görünürdü ve hiçbir test görmüyordu.
      #
      # Bütün storage şeması yerine yalnızca kendi politikalarımız
      # karşılaştırılıyor; Supabase'in yönettiği tablolar sürümden sürüme
      # değişiyor ve karşılaştırmaya girseler kapı gürültüye boğulurdu.
      - name: Compare storage.objects policies
        id: storage_policies
        continue-on-error: true
        run: |
          # `--agent yes` çıktısı her yanıta rastgele bir "boundary" alanı
          # koyuyor. Ham yanıtları karşılaştırmak o rastgele değeri fark
          # sanıyor ve kapı her turda kırmızı yanıyordu. Yalnızca veri
          # karşılaştırılıyor; jq -S anahtarları sıralayarak biçim
          # farklarını da eliyor.
          supabase db query --linked --agent yes --output-format json -f scripts/sql/storage-politikalari.sql \
            | jq -S '.rows' > .schema-audit/storage-production.json
          supabase db query --local --agent yes --output-format json -f scripts/sql/storage-politikalari.sql \
            | jq -S '.rows' > .schema-audit/storage-local.json
          if diff -u .schema-audit/storage-production.json .schema-audit/storage-local.json; then
            echo "storage politikaları aynı"
          else
            echo "::error::storage.objects politikaları üretim ile depo arasında ayrışıyor."
            exit 1
          fi

      # SINIRLI YENİDEN DENEME — GERÇEK KAYMAYI GİZLEMİYOR
      #
      # Fark bulunursa üretim yeniden dökülüp yeniden karşılaştırılıyor.
      # Amaç yalnızca YARIŞI kapatmak: göç bir dakika sonra uygulanmışsa
      # ikinci deneme temiz geçiyor.
      #
      # Gerçek bir şema kayması bundan ETKİLENMİYOR: kayma üç denemede de
      # duruyor ve adım kırmızı bitiyor. Her deneme ayrı ayrı loglanıyor
      # ve son `schema-diff.json` artifact'a yükleniyor — yani "denedik,
      # geçti" diye bir şey saklanmıyor, kaçıncı denemede geçtiği
      # görünüyor.
      - name: Build semantic schema comparison
        id: semantic_diff
        continue-on-error: true
        run: |
          set -o pipefail
          deneme=1
          enfazla=3
          while :; do
            echo "::group::semantik karşılaştırma — deneme $deneme/$enfazla"
            if node scripts/schema-semantic-diff.mjs \
                 .schema-audit/production.normalized.sql \
                 .schema-audit/local.normalized.sql \
                 .schema-audit/schema-diff.json; then
              echo "fark yok (deneme $deneme)"
              echo '::endgroup::'
              exit 0
            fi
            echo "fark bulundu (deneme $deneme):"
            cat .schema-audit/schema-diff.json
            echo '::endgroup::'

            if [ "$deneme" -ge "$enfazla" ]; then
              echo "::error::Üretim şeması depodaki göçlerle $enfazla denemede de eşleşmedi. Fark gerçek: schema-diff.json artifact'ında."
              exit 1
            fi

            # Göç sürüm hattında hâlâ uygulanıyor olabilir.
            echo "60 saniye sonra üretim yeniden dökülecek."
            sleep 60
            supabase db dump --linked --schema public,extensions --file .schema-audit/production.sql
            node scripts/normalize-schema-dump.mjs \
              .schema-audit/production.sql \
              .schema-audit/production.normalized.sql \
              | tee .schema-audit/production-fingerprint.json
            grep -E '^(GRANT|REVOKE) ' .schema-audit/production.sql > .schema-audit/production-grants.sql || true
            deneme=$((deneme + 1))
          done
      - name: Upload schema-only audit artifact
        if: always() && steps.production_snapshot.outcome == 'success' && steps.local_snapshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: production-schema-baseline-audit-${{ github.run_id }}
          path: .schema-audit/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - name: Write audit summary
        if: always()
        run: |
          {
            echo '## Production schema baseline audit'
            echo
            echo '- Production snapshot: ${{ steps.production_snapshot.outcome }}'
            echo '- Local rebuild: ${{ steps.local_snapshot.outcome }}'
            echo '- Rolled-back 0022 verification: ${{ steps.verify_0022.outcome }}'
            echo '- Semantic diff: ${{ steps.semantic_diff.outcome }}'
            echo '- storage.objects policies: ${{ steps.storage_policies.outcome }}'
            echo '- Data dump: not requested; schema dump defaults to schema-only.'
            echo '- Migration repair: not run.'
          } >> "$GITHUB_STEP_SUMMARY"
      # HANGİ KAPI DÜŞTÜ — MESAJDA YAZIYOR
      #
      # Bu adım eskiden yalnız "baseline is not verified" diyordu ve üç
      # kapıdan hangisinin düştüğünü söylemiyordu. Üç kapı da
      # `continue-on-error: true` olduğu için GitHub API'si onların
      # `conclusion` değerini `success` gösteriyor (`outcome` değerini
      # göstermiyor) — yani `gh run view` ile bakıldığında BÜTÜN adımlar
      # yeşil, yalnız bu son adım kırmızı görünüyordu. Nedeni bulmak için
      # ham log indirmek gerekti.
      #
      # Artık üç outcome mesajın içinde.
      - name: Fail closed on schema or 0022 differences
        if: steps.semantic_diff.outcome != 'success' || steps.verify_0022.outcome != 'success' || steps.storage_policies.outcome != 'success'
        run: |
          echo "::error::Üretim şema temeli doğrulanmadı — semantik diff: ${{ steps.semantic_diff.outcome }}, 0022 doğrulama: ${{ steps.verify_0022.outcome }}, storage politikaları: ${{ steps.storage_policies.outcome }}. Temel alma, onarım, göç gönderimi, Edge Function ve Cloudflare dağıtımı bloke."
          exit 1
      - name: Stop disposable local Supabase database
        if: always()
        run: supabase stop --no-backup
