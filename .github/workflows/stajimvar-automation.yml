name: StajımVar otomasyonları

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Hiçbir şey yazma, sadece raporla"
        type: boolean
        default: false
  schedule:
    # İlan kaynaklarını saatte bir tarar.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: stajimvar-discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      # İki isim de kabul ediliyor, önce yenisi.
      #
      # NEDEN: anahtar iptal edilip yenisi üretildiğinde GitHub'ın "mevcut
      # sırrı düzenle" ekranı kaydetmedi — listede "Last updated" değişmedi ve
      # çalıştırmalar iptal edilmiş anahtarla "Unregistered API key" almaya
      # devam etti. Var olan sırrı güncellemek yerine YENİ bir sır eklemek
      # farklı bir yol izliyor ve sorunsuz çalışıyor.
      #
      # SUPABASE_SECRET_KEY tanımlıysa o kullanılır; tanımlı değilse eski
      # isme düşer. Böylece eski sırrı silmek de gerekmiyor.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # PASİFLEŞTİRME: TEK KAYNAKTA AÇIK
      #
      # Şalter aylardır kapalıydı ve kapanan ilanları elle kaldırıyorduk.
      # Açmadan önce üç şeyin doğrulanması gerekiyordu:
      #
      # 1. Yinelenen kayıt sorunu: aynı ilan için ikinci satır açılınca
      #    eskisinin sayacı tırmanıyor ve AÇIK ilan kapanmış sanılıyordu.
      #    Uygulama tarafı 17 Ağustos'ta düzeltildi, 18 Ağustos'ta
      #    veritabanı kısıtı eklendi (0017) ve kalan tek çift temizlendi.
      # 2. Düşürme yolu yayındaki ilana hiç dokunmuyordu; yalnızca keşif
      #    kaydını bayat işaretliyordu. Yani şalter açılsa bile ilan sitede
      #    kalacaktı — halka eklendi.
      # 3. Devre kesici küçük kaynaklarda her zaman devredeydi: 4'ten az
      #    ilanı olan bir kaynakta tek kayıp %25'i aştığı için pasifleştirme
      #    hiç çalışamıyordu. Küçük kaynaklarda artık oran yerine mutlak
      #    sınır var (tur başına en fazla bir ilan).
      #
      # İzin listesi tek kaynakla başlıyor: vertigogames-workable. İki ilanı
      # var, yani bir kapanma gerçekten tespit edilebiliyor (tek ilanlı
      # kaynakta sıfır sonuç ANOMALİ sayılıp sayaç hiç ilerlemiyor) ama iş
      # ters giderse etkilenecek en fazla bir ilan var.
      #
      # Yanlış pozitif kalıcı değil: ilan kaynakta yeniden görülünce
      # otomatik olarak yayına geri alınıyor.
      ALLOW_INSERT_UPDATE: "true"
      ALLOW_DEACTIVATION: "true"
      # KAYNAK BAZINDA DEGERLENDIRILDI (14 gunluk tur gecmisi olculdu)
      #
      # Olcut: kaynak deterministik mi? Yani "ilan listede yok" gercekten
      # "ilan kapandi" demek mi, yoksa kaynagin kendisi mi dalgalaniyor?
      # Bos donen tur orani bunun en dogrudan gostergesi.
      #
      # workable-tr-arama SONRADAN ACILDI. Once "cok sorgulu arama, yumusak
      # bos yanit gercek kuculmeden ayirt edilemiyor" diye kapaliydi. Uc
      # olcum bu itirazi kaldirdi:
      #
      #   1. Hiz siniri SESSIZ DEGIL: 189 turun birinde HTTP 429 alindi ve
      #      raise_for_status() turu FAILED yapti. Yumusak bos yanit
      #      gozlenmedi.
      #   2. Ilan basina dalgalanma YOK: izlenen 13 kaydin kacirma sayaci
      #      ya 0 ya 63+. Arada hicbir deger yok, yani "bir tur kaybolup
      #      geri gelme" davranisi hic yasanmamis.
      #   3. Golge calistirma (automation/shadow_deactivation.py): kapatma
      #      acik olsaydi 2 ilan kapanacakti ve IKISI DE zaten kapali —
      #      basvuru baglantilari HTTP 410 dondugu icin. Yanlis pozitif 0.
      #
      # Ayrica adaptore arama birimi kapsamasi eklendi: beklenmedik govde
      # donen tek bir alt istek bile turu DEGRADED yapiyor ve DEGRADED tur
      # hicbir ilani kapatmiyor.
      #
      # ACIK (bos tur orani <= %2, tek sirketli pano, sabit kimlik):
      #   vertigogames-workable   189 tur, %98.9 saglikli,   2 bos (%1)
      #   newmindai-workable      153 tur, %100  saglikli,   0 bos
      #   rapsodo-workable        153 tur, %100  saglikli,   0 bos
      #   sanction-scanner-workable 153 tur, %100 saglikli,  0 bos
      #   alumil-workable         188 tur, %98.9 saglikli,   2 bos (%1)
      #   insiderone-lever        190 tur, %100  saglikli,   3 bos (%1.6)
      #
      # KAPALI ve neden:
      #   ciceksepeti-lever  — 189 turun 39'u bos (%21). 1 ile 0 arasinda
      #     gidip geliyor; "listede yok" burada kapanma sinyali degil.
      #   astrazeneca-workday — 188 turun 125'i bos (%66). Workday
      #     beslemeleri sayfalama/filtre nedeniyle sik sik bos donuyor.
      #   lalamove-lever     — 187 turun 13'u bos (%7). Sinirda; once
      #     digerleri izlenecek.
      #   Ilani hic olmayan kaynaklar — kapatilacak bir sey yok.
      DEACTIVATION_ENABLED_SOURCES: "workable-tr-arama,vertigogames-workable,newmindai-workable,rapsodo-workable,sanction-scanner-workable,alumil-workable,insiderone-lever"
      # Dağıtım sırları. `if` koşulunda secrets.* doğrudan okunamıyor,
      # env.* okunabiliyor — bu yüzden buraya taşınıyorlar. Tanımlı
      # değillerse boş dize oluyor ve dağıtım adımları atlanıyor.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Tarayıcı tarafı anahtarı. Gizli değil (her ziyaretçi görüyor, RLS
      # koruyor) ama derlemede BULUNMAK ZORUNDA: boş bir anahtarla üretilen
      # paket veritabanına bağlanamıyor ve site ilan gösteremiyor.
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r automation/requirements-dev.txt

      # Sırlar tanımlı değilse hemen ve anlaşılır biçimde dur. Yoksa hata
      # taramanın ortasında bir Python yığın izi olarak çıkıyor ve e-postadan
      # neyin eksik olduğu anlaşılmıyor.
      - name: Sırları doğrula
        run: |
          eksik=""
          [ -z "$SUPABASE_URL" ] && eksik="$eksik SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && eksik="$eksik SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$eksik" ]; then
            echo "::error::Depo sırları eksik:$eksik — GitHub > Settings > Secrets and variables > Actions bölümünden ekleyin. Anahtar için SUPABASE_SECRET_KEY adıyla YENİ bir sır ekleyin."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::VITE_SUPABASE_ANON_KEY tanımlı değil — tarama çalışacak ama SİTE DAĞITILMAYACAK. Boş anahtarla derlenen paket veritabanına bağlanamaz ve canlı siteyi kırar; bu yüzden dağıtım bilerek atlanıyor."
          fi
          echo "Sırlar tanımlı."

      - name: Testler
        run: python -m pytest tests/ -q
        working-directory: automation
      - name: Kaynakları tara
        run: python discover.py ${{ inputs.dry_run && '--dry-run' || '' }}
        working-directory: automation

      # Keşif havuzundan yayına geçiş. Bu adım olmadan bulunan ilanlar
      # raw_listings içinde birikir ve sitede hiç görünmezdi.
      - name: Yayına al
        if: ${{ !inputs.dry_run }}
        run: python promote.py
        working-directory: automation

      # İlan listesi her turda değişiyor; sitemap de değişmeli. Elle
      # yazılan bir sitemap bir gün sonra kapanan ilana yönlendirir ve yeni
      # ilanı hiç tanıtmaz. Çıktı bir sonraki dağıtımda yayına giriyor.
      - name: Sitemap üret
        if: ${{ !inputs.dry_run }}
        run: python sitemap.py
        working-directory: automation
        continue-on-error: true

      # Yeni şirketlerin logosunu kendi sitelerinden çeker. Logosu olanları
      # atlar, yani her çalıştırmada yalnızca yeni gelenler işlenir.
      - name: Eksik logoları tamamla
        if: ${{ !inputs.dry_run }}
        run: python logos.py
        working-directory: automation
        continue-on-error: true

      # --- Siteyi yayına al ------------------------------------------------
      #
      # NEDEN GEREKLİ
      # Site artık ön render ediliyor: ilan sayfalarının HTML'i, JobPosting
      # yapısal verisi ve site haritası DERLEME anında üretiliyor. Tarama
      # yeni bir ilan bulup veritabanına yazsa bile, dağıtım olmadan o ilanın
      # arama motorunun göreceği sayfası oluşmuyor.
      #
      # Google for Jobs'ta tazelik her şey; bir ilanı elle dağıtım
      # bekletmek onu değersizleştiriyor.
      #
      # SIR YOKSA SESSİZCE ATLANIR
      # `if` koşulu token'ın varlığına bakıyor. Sırlar tanımlanmadan bu adım
      # hiç çalışmıyor — çalışmayacak bir işi kırmızı bildirimle her saat
      # tekrarlatmak, bu dosyada zaten bilerek kaçınılan bir şey.
      - name: Node kur
        if: ${{ !inputs.dry_run && env.CLOUDFLARE_API_TOKEN != '' && env.VITE_SUPABASE_ANON_KEY != '' }}
        uses: actions/setup-node@v4
        with:
          # Wrangler 4 en az Node 22 istiyor; 20 ile 'requires at least
          # Node.js v22' diyip cikiyor (olculdu, dagitim adimi bu yuzden
          # dustu). Derleme 20 ile de calisiyordu, kiran yalnizca yukleme.
          node-version: '22'
          cache: npm

      - name: Bağımlılıklar
        if: ${{ !inputs.dry_run && env.CLOUDFLARE_API_TOKEN != '' && env.VITE_SUPABASE_ANON_KEY != '' }}
        run: npm ci

      # Derleme ön render betiğini de çalıştırıyor; o betik ilanları
      # Supabase'ten okuyor, bu yüzden VITE_* değişkenleri gerekiyor.
      - name: Derle
        if: ${{ !inputs.dry_run && env.CLOUDFLARE_API_TOKEN != '' && env.VITE_SUPABASE_ANON_KEY != '' }}
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}

      - name: Cloudflare Pages'e yükle
        # Production yayın sırası Supabase migration/function başarılı olduktan
        # sonra yalnızca supabase-production.yml tarafından yönetilir.
        if: ${{ false }}
        run: npx wrangler pages deploy dist --project-name stajimvar --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

# --- Devre dışı: başvuru e-postası gönderimi ---------------------------------
# Eski repodaki `notify` işi, henüz kurmadığımız bir e-posta sağlayıcısına ve
# `claim_application_notifications` RPC'sine bağlıydı; bu şemada ikisi de yok.
# Bilerek kaldırıldı — çalışmayacak bir işi zamanlanmış bırakmak her beş
# dakikada bir kırmızı bildirim üretirdi.
#
# Geri açmak için gerekenler:
#   1. E-posta sağlayıcısı seçimi ve stajimvar.com için SPF/DKIM doğrulaması
#   2. Başvuru gönderim kuyruğu (applications.email_delivery_status = 'pending')
#   3. automation/notifier.py'nin yeni şemaya uyarlanması
