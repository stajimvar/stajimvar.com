name: Keşif radarı (gölge)

# RADAR CANONICAL TOPLAMADAN İZOLE
#
# Bu iş akışı saatlik tarayıcıya (stajimvar-automation.yml) ve üretim
# dağıtımına DOKUNMUYOR. Radar patlarsa canonical ilan toplama
# etkilenmiyor; bu yüzden ayrı workflow, ayrı zamanlama, ayrı hata
# yüzeyi.
#
# GÖLGE MODU: radar public akışa hiçbir şey yazmıyor. `RADAR_AUTO_PUBLISH`
# varsayılan olarak kapalı ve bu akışta hiç açılmıyor — sayıları
# görmeden otomatik yayın yok.

on:
  workflow_dispatch:
    inputs:
      sayfa_sayisi:
        description: "Kaynak başına taranacak liste sayfası"
        required: false
        default: "2"
      test_sorgusu:
        description: "Doldurulursa TEK arama yapıp çıkar (anahtar denemesi)"
        required: false
        default: ""
      mod:
        description: "resmi = Brave→ATS · linkedin = LinkedIn sinyal radarı · kesif = Kariyer.net"
        required: false
        default: "resmi"
        type: choice
        options: ["resmi", "linkedin", "linkedin-teshis", "kesif"]
  schedule:
    # Günde bir. Keşif kaynakları saatlik değişmiyor; saatlik çekmek
    # kaynağa gereksiz yük bindirmek olurdu.
    - cron: "35 5 * * *"

permissions:
  contents: read

concurrency:
  group: stajimvar-kesif-radari
  cancel-in-progress: false

jobs:
  golge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Bu akışta ASLA açılmıyor.
      RADAR_AUTO_PUBLISH: "false"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Şirket alan adı KEŞFİ için. Değeri hiçbir adımda yazdırılmıyor;
      # yokluğunda radar düşmüyor, arama katmanı kapalı raporlanıyor.
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      # Kaçak döngüye karşı sert tavan.
      MAX_SEARCH_QUERIES_PER_RUN: "100"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install -r automation/requirements-scraper.txt

      - name: Radar testleri
        run: python -m pytest automation/tests -q

      # ANAHTARIN VARLIĞI — DEĞERİ DEĞİL
      #
      # Yalnızca "geldi mi" bilgisi yazılıyor. Değer hiçbir koşulda
      # ekrana çıkmıyor; fork/PR bağlamında secret gelmiyor ve koşu
      # buna göre kapalı katmanla devam ediyor.
      - name: Arama anahtarı geldi mi
        run: |
          if [ -n "$BRAVE_SEARCH_API_KEY" ]; then
            echo "arama katmanı: anahtar mevcut (${#BRAVE_SEARCH_API_KEY} karakter)"
          else
            echo "::warning::arama katmanı: anahtar yok — katman kapalı çalışacak"
          fi

      # GİRDİ KABUK SATIRINA GÖMÜLMÜYOR
      #
      # `${{ inputs... }}` doğrudan `run:` içine yazılırsa girdideki
      # tırnak komutu bölüyor (ilk denemede tam bu oldu) ve daha
      # kötüsü kabuk enjeksiyonuna açık kalıyor. Değer ortam
      # değişkeninden geçiyor.
      - name: Tek kontrollü arama denemesi
        if: ${{ inputs.test_sorgusu != '' }}
        env:
          TEST_SORGUSU: ${{ inputs.test_sorgusu }}
        run: python -m automation.radar_kosu --test-sorgusu "$TEST_SORGUSU"

      # RESMÎ WEB RADARI — Brave doğrudan resmî ATS ilanı arıyor.
      - name: Resmî radar gölge koşusu
        if: ${{ inputs.test_sorgusu == '' && (inputs.mod || 'resmi') == 'resmi' }}
        run: python -m automation.radar_resmi_kosu --sorgu-siniri 120

      # LINKEDIN RADARI — LinkedIn'e İSTEK GİTMİYOR
      #
      # Sinyal Brave'in kamuya açık dizininden okunuyor; yayın kararını
      # şirketin resmî ATS ilanı veriyor. Bütçe iki katmanda korunuyor:
      # `Butce` sınıfı (430 sert tavan, 220 keşif / 180 çözüm / 30 yedek)
      # ve arama sağlayıcısının kendi tavanı.
      - name: LinkedIn radarı gölge koşusu
        if: ${{ inputs.test_sorgusu == '' && inputs.mod == 'linkedin' }}
        env:
          MAX_SEARCH_QUERIES_PER_RUN: "430"
        run: python -m automation.radar_linkedin_kosu --kesif-siniri 220 --toplam-tavan 430

      # TEŞHİS: yalnız keşif, çözüm bütçesi harcanmadan. Ayrıştırıcıyı
      # gerçek sonuç biçimiyle düzeltmek için ucuz koşu.
      - name: LinkedIn keşif teşhisi
        if: ${{ inputs.test_sorgusu == '' && inputs.mod == 'linkedin-teshis' }}
        env:
          MAX_SEARCH_QUERIES_PER_RUN: "430"
        run: python -m automation.radar_linkedin_kosu --sadece-kesif --kesif-siniri 6

      # KEŞİF RADARI — Kariyer.net. Artık canonical ilan kaynağı değil;
      # "bu şirket stajyer arıyor" sinyali olarak duruyor.
      - name: Keşif radarı gölge koşusu
        if: ${{ inputs.test_sorgusu == '' && inputs.mod == 'kesif' }}
        env:
          SAYFA: ${{ inputs.sayfa_sayisi || '2' }}
        run: python -m automation.radar_kosu --sayfa "$SAYFA"

      - name: Raporu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-golge-raporu
          path: |
            radar-rapor.json
            radar-resmi-rapor.json
            radar-linkedin-rapor.json
          if-no-files-found: warn
