name: Supabase production release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stajimvar-production-release
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: gdumgdgwlfnohkaucfow
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      supabase_changed: ${{ steps.detect.outputs.supabase_changed }}
      app_changed: ${{ steps.detect.outputs.app_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        name: Değişen dağıtım alanlarını güvenli sınıflandır
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/detect-deploy-changes.mjs

  validate_app:
    needs: changes
    if: github.repository == 'stajimvar/stajimvar.com' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/deploy-change-detection.test.mjs `HEAD^` okuyor; varsayilan
          # sig klonda ata commit yok ve test ortam yuzunden dusuyordu.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # TEK DOSYA DEGIL, TUM PAKET
      #
      # Burada yalnizca tests/opportunity-domain.test.mjs kosuyordu; geri
      # kalan yuzlerce test yalnizca gelistirici bilgisayarinda calisiyor
      # ve dagitimi HIC engellemiyordu. Kritik olanlar (sirket dogrulama,
      # burs kisit semantigi, aday karti rizasi) bu paketin icinde.
      - name: JS testleri
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python testleri (crawler guvenligi)
        run: |
          pip install -r automation/requirements-dev.txt
          python -m pytest automation/tests -q
      - run: npm run build

  # GUVENLIK REGRESYONU DAGITIMI DURDURUYOR
  #
  # supabase/tests altindaki SQL elle calistiriliyordu; yani bir RLS
  # politikasi yanlislikla gevsetilse CI bunu FARK ETMIYORDU. Is tek
  # kullanimlik yerel bir veritabaninda calisiyor: uretim verisine
  # dokunmuyor, kendi kullanicilarini yaratiyor ve `db reset` ile
  # migration'lari sifirdan uyguladigi icin ayni zamanda temiz kurulum
  # duman testi.
  security_regression:
    needs: changes
    if: github.repository == 'stajimvar/stajimvar.com' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Migrationlari sifirdan uygula (temiz kurulum duman testi)
        run: supabase db reset --local --no-seed
      - name: RLS guvenlik regresyonu
        run: |
          local_db_url="$(supabase status -o env | node scripts/assert-disposable-db-url.mjs)"
          psql -v ON_ERROR_STOP=1 -f scripts/sql/disposable-security-tests.sql "$local_db_url"
          psql -v ON_ERROR_STOP=1 -f scripts/sql/rls-regresyon-testleri.sql "$local_db_url"
      - name: Tek kullanimlik kaplari temizle
        if: always()
        run: supabase stop --no-backup

  migrate_and_functions:
    needs: changes
    if: github.repository == 'stajimvar/stajimvar.com' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.supabase_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # ELLE UYGULANMIŞ MIGRATION'LARI GEÇMİŞE İŞLE
      #
      # NEDEN GEREKİYOR
      # Bir migration Supabase panelindeki SQL Editor'den elle çalıştırıldığında
      # şema değişiyor ama supabase_migrations.schema_migrations tablosuna
      # KAYIT DÜŞMÜYOR. Sonraki çalıştırmada aşağıdaki kapı bunu "yerelde var,
      # uzakta yok" diye görüp `db push`'u durduruyor — ve o kapı site
      # dağıtımını da beklettiği için yeni kod da yayına çıkamıyor.
      #
      # 22 Ağustos'ta tam bu oldu: 20260822160000 elle çalıştırıldı, sonraki
      # push'ta dağıtım kilitlendi.
      #
      # NE YAPIYOR
      # Yereldeki her migration dosyası için uzak geçmişe bakıyor. Dosya
      # uzakta yoksa ve şema zaten o değişikliği içeriyorsa `migration repair`
      # ile "uygulandı" diye işaretliyor. Şemayı DEĞİŞTİRMİYOR; yalnızca
      # defteri gerçeğe uyduruyor.
      #
      # NEDEN GÜVENLİ
      # Yalnızca `scripts/sql/elle-uygulananlar.txt` içinde adı yazan sürümler
      # onarılıyor. Yani "uzakta yok" diye görülen her migration otomatik
      # onaylanmıyor — gerçekten elle çalıştırdığımızı bildiğimiz, listeye
      # elle yazdığımız sürümler onarılıyor. Liste boşsa bu adım hiçbir şey
      # yapmıyor ve kapı eskisi gibi çalışıyor.
      - name: Elle uygulanmış migrationları geçmişe işle
        run: |
          liste=scripts/sql/elle-uygulananlar.txt
          dusulenler=scripts/sql/gecmisten-dusulenler.txt
          if [ ! -f "$liste" ] && [ ! -f "$dusulenler" ]; then
            echo "onarım listesi yok, atlanıyor"
            exit 0
          fi

          # YALNIZCA GEREKEN ÇAĞRILAR
          #
          # Önceden iki liste baştan sona geziliyor ve her sürüm için bir
          # repair çağrılıyordu: doksan üç ağ çağrısı, yaklaşık on beş
          # dakika, şema değiştiren HER commit'te. Uzlaştırma bir kez
          # yapıldıktan sonra bu çağrıların neredeyse tamamı hiçbir şeyi
          # değiştirmiyor — ve doksan üç çağrının biri geçici bir ağ
          # hatasıyla düşerse tur çöpe gidiyor.
          #
          # Plan, migration list çıktısını KAPININ KULLANDIĞI ayrıştırıcıyla
          # okuyor. Daha önce burada bir grep deseni vardı; çıktı ters
          # tırnaklı bir tablo olduğu için kırılgandı ve yanlış eşleşirse
          # onarım sessizce atlanıyordu.
          #
          # ESKİ SOY NEDEN DÜŞÜLÜYOR
          # Üretim, deponun 0001..0022 tabanına sıkıştırılmasından önceki
          # damgalı soyu taşıyordu. İki soy aynı şemayı üretiyor — şema
          # temel denetimi farkı SIFIR ölçtü — ama tek bir sürüm numarası
          # bile örtüşmüyor. Şemaya DOKUNULMUYOR; yalnızca hangi kümenin
          # izlendiği kaydı düzeliyor. Düşülenlerin adı ve gerekçesi:
          # scripts/sql/uzak-gecmis-anlik-goruntu-20260830.txt
          supabase migration list --project-ref "$SUPABASE_PROJECT_REF" > /tmp/onarim-oncesi.txt
          node scripts/supabase-onarim-plani.mjs /tmp/onarim-oncesi.txt "$liste" "$dusulenler" > /tmp/onarim-plani.txt

          if [ ! -s /tmp/onarim-plani.txt ]; then
            echo "defter zaten uzlaşmış; onarılacak sürüm yok"
          fi

          hata=0
          while read -r durum surum; do
            [ -n "$surum" ] || continue
            echo "-> $surum : $durum"
            if ! supabase migration repair --status "$durum" "$surum" --project-ref "$SUPABASE_PROJECT_REF"; then
              echo "::warning::$surum için repair başarısız ($durum)"
              hata=$((hata + 1))
            fi
          done < /tmp/onarim-plani.txt

          # Başarısızlıklar adımı düşürmüyor — kapı zaten defteri yeniden
          # okuyup karar verecek. Ama SESSİZ kalmıyor: eskiden her çağrı
          # `|| true` ile yutuluyordu ve kapı kırmızı yandığında nedeni
          # görünmüyordu.
          if [ "$hata" -gt 0 ]; then
            echo "::warning::$hata onarım çağrısı başarısız oldu; kapı raporuna bak."
          fi

      - name: Remote/local migration geçmişini doğrula
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN GitHub Actions secret'i eksik."
            exit 1
          fi
          supabase migration list --project-ref "$SUPABASE_PROJECT_REF" | tee /tmp/supabase-migration-list.txt
          node scripts/supabase-history-gate.mjs /tmp/supabase-migration-list.txt
      - name: Migration planını doğrula
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF" --dry-run
      - name: Migrationları uygula
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF"
      - name: Edge Functionları JWT doğrulamayla dağıt
        run: supabase functions deploy opportunity-source-check --project-ref "$SUPABASE_PROJECT_REF"

  # SİTE DAĞITIMI ŞEMA İŞİNE YENİDEN BAĞLI
  #
  # 22 Ağustos'ta bu bağ koparılmıştı ve gerekçesi doğruydu: migration işi
  # o tarihte HİÇ geçemiyordu. Üretim, deponun 0001..0022 tabanına
  # sıkıştırılmasından önceki damgalı soyu taşıyordu; tek bir sürüm bile
  # örtüşmediği için kapı her iki yönde de "karşı tarafta yok" diyordu.
  # Kalıcı kırmızı bir kapı, olmayan kapıdan kötüdür — sahibi onu elle
  # atlamayı öğrenir ve gerçek uyarı geldiğinde de atlar.
  #
  # 30 Ağustos'ta tıkanıklığın kendisi çözüldü:
  #   - Eksik SUPABASE_DB_PASSWORD eklendi; şema temel denetimi 26 koşundan
  #     sonra ilk kez gerçekten çalıştı ve üretim ile depodan sıfırdan
  #     kurulan şema arasında FARK OLMADIĞINI ölçtü.
  #   - Defter o ölçüme dayanarak uzlaştırıldı (elle-uygulananlar.txt +
  #     gecmisten-dusulenler.txt).
  #   - Kapı, bekleyen göçü ayrışmadan ayırt eder hâle geldi; önceden yeni
  #     yazılmış her göç "ayrışma" sayılıyordu, yani db push'a hiç sıra
  #     gelmiyordu.
  #
  # Artık şema inmeden onu bekleyen kod yayına çıkmıyor.
  #
  # ATLANMIŞ İŞ ENGEL DEĞİL
  # supabase/ altında değişiklik yoksa migrate_and_functions hiç çalışmıyor
  # ve sonucu 'skipped' oluyor. Sıradan bir arayüz değişikliğinin dağıtımını
  # bu yüzden durdurmak, kapıyı yeniden kalıcı kırmızıya çevirirdi.
  cloudflare_production:
    needs: [changes, validate_app, security_regression, migrate_and_functions]
    if: >-
      ${{
        always() &&
        github.repository == 'stajimvar/stajimvar.com' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        needs.validate_app.result == 'success' &&
        needs.security_regression.result == 'success' &&
        (needs.migrate_and_functions.result == 'success' ||
         needs.migrate_and_functions.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dağıtım sırlarını doğrula
        run: |
          for name in CLOUDFLARE_API_TOKEN VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            [ -n "${!name}" ] || { echo "::error::$name GitHub Actions secret'i eksik."; exit 1; }
          done
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx wrangler pages deploy dist --project-name stajimvar --branch main --commit-dirty=true
