<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="400" height="700" role="img" aria-label="Staj başvuru e-postasının altı parçası: alıcı, konu satırı, kısa giriş, neden bu şirket, net kapanış ve CV eki. Alanlar köşeli parantezli yer tutucu.">
  <style>
    .k{fill:#0f172a}.g{fill:#64748b}
    .n{font:400 12.5px system-ui,sans-serif}
    .b{font:700 13.5px system-ui,sans-serif}
    .rozet{font:800 12px system-ui,sans-serif;fill:#fff}
    .etiket{font:800 10.5px system-ui,sans-serif;fill:#64748b;letter-spacing:.07em}
  </style>

  <rect width="400" height="700" fill="#f8fafc"/>
  <rect x="16" y="16" width="368" height="668" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 1 kime -->
  <circle cx="42" cy="56" r="13" fill="#2563eb"/>
  <text x="42" y="61" class="rozet" text-anchor="middle">1</text>
  <text x="66" y="48" class="etiket">KİME</text>
  <text x="66" y="66" class="b k">ik@ornek-sirket.com</text>
  <text x="66" y="86" class="n g">Tek alıcı. Toplu gönderimde kimse</text>
  <text x="66" y="104" class="n g">cevap vermiyor.</text>
  <line x1="66" y1="120" x2="366" y2="120" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 2 konu -->
  <circle cx="42" cy="150" r="13" fill="#2563eb"/>
  <text x="42" y="155" class="rozet" text-anchor="middle">2</text>
  <text x="66" y="142" class="etiket">KONU</text>
  <text x="66" y="160" class="b k">Staj Başvurusu — Makine Müh. —</text>
  <text x="66" y="178" class="b k">Temmuz/Ağustos</text>
  <text x="66" y="198" class="n g">Açılıp açılmayacağını bu satır belirliyor.</text>
  <line x1="66" y1="214" x2="366" y2="214" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 3 kısa giriş -->
  <circle cx="42" cy="244" r="13" fill="#2563eb"/>
  <text x="42" y="249" class="rozet" text-anchor="middle">3</text>
  <text x="66" y="236" class="etiket">KISA GİRİŞ</text>
  <text x="66" y="256" class="n k">[Üniversite] [Bölüm] 3. sınıf öğrencisiyim.</text>
  <text x="66" y="274" class="n k">Zorunlu stajım kapsamında [tarih] – [tarih]</text>
  <text x="66" y="292" class="n k">arasında 20 iş günü staj yapmam gerekiyor.</text>

  <!-- 4 neden bu şirket -->
  <circle cx="42" cy="336" r="13" fill="#2563eb"/>
  <text x="42" y="341" class="rozet" text-anchor="middle">4</text>
  <text x="66" y="328" class="etiket">NEDEN BU ŞİRKET</text>
  <text x="66" y="348" class="n k">[Şirket adı]’nın [somut konu] tarafıyla</text>
  <text x="66" y="366" class="n k">ilgileniyorum çünkü [tek cümle sebep].</text>
  <rect x="66" y="380" width="284" height="28" rx="8" fill="#eff6ff"/>
  <text x="80" y="399" class="n" fill="#1d4ed8">E-postayı ayıran tek cümle burası.</text>

  <!-- 5 net kapanış -->
  <circle cx="42" cy="446" r="13" fill="#2563eb"/>
  <text x="42" y="451" class="rozet" text-anchor="middle">5</text>
  <text x="66" y="438" class="etiket">NET KAPANIŞ</text>
  <text x="66" y="458" class="n k">Zorunlu staj sigortam okulum tarafından</text>
  <text x="66" y="476" class="n k">karşılanıyor. Uygun olursanız kısa bir</text>
  <text x="66" y="494" class="n k">görüşme yapabilir miyiz?</text>
  <text x="66" y="518" class="n g">[Ad Soyad] · [Telefon]</text>

  <!-- 6 ek -->
  <circle cx="42" cy="566" r="13" fill="#2563eb"/>
  <text x="42" y="571" class="rozet" text-anchor="middle">6</text>
  <text x="66" y="558" class="etiket">EK</text>
  <rect x="66" y="568" width="220" height="34" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <path d="M84 579v11a5 5 0 0 0 10 0v-13a3 3 0 0 0-6 0v12" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="106" y="590" class="n k">AdSoyad-CV.pdf</text>
  <text x="66" y="626" class="n g">PDF gönder; “cv.pdf” adlı dosya İK</text>
  <text x="66" y="644" class="n g">klasöründe kayboluyor.</text>
  <text x="66" y="668" class="n" fill="#94a3b8">Köşeli parantezli alanlar yer tutucu.</text>
</svg>
